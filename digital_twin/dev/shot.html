<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;height:100%;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block}</style></head><body>
<iframe id="f"></iframe>
<script>
// Dev-only screenshot harness: shot.html?t=x,y,z&p=x,y,z&hide=room&exp=0.4
const q=new URLSearchParams(location.search),f=document.getElementById("f");if(q.get("w"))f.style.width=q.get("w")+"px";f.src="../index.html"+(q.get("token")?"#token="+q.get("token"):"");
const it=setInterval(()=>{const w=f.contentWindow,d=w.studioDebug;if(!d||!d.ready&&d.ready!==undefined)return;clearInterval(it);
 try{
 if(q.get('full'))w.document.getElementById('expandView').click();
 if(q.get('hide')==='room'&&d.environment)d.environment.room.visible=false;
 if(q.get('eval'))(new w.Function('d',q.get('eval')))(d);
 if(q.get('t')){d.controls.target.fromArray(q.get('t').split(',').map(Number));d.camera.position.fromArray(q.get('p').split(',').map(Number));d.controls.update();}
 }catch(e){document.title='ERR '+e.message;}
},200);
</script></body></html>
